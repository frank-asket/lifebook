events { worker_connections 2048; }

http {
    upstream api_gateway {
        server api-gateway:8000;
        keepalive 32;
    }

    upstream identity_provider {
        server identity-provider:8081;
        keepalive 16;
    }

    upstream static_content {
        server static-content:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Healthcheck
        location /healthz {
            return 200 '{"status":"healthy","service":"load-balancer"}\n';
            add_header Content-Type application/json;
        }

        # Static Assets
        location /static/ {
            proxy_pass http://static_content/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Identity / Auth
        location /auth/ {
            proxy_pass http://identity_provider/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Core API via API Gateway
        location /api/ {
            proxy_pass http://api_gateway/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
