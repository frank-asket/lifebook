version: '3.8'

services:
  # -------------------------------------------------------------
  # Ingress & Edge Layer
  # -------------------------------------------------------------
  load-balancer:
    image: nginx:alpine
    container_name: load-balancer
    ports:
      - "80:80"
    volumes:
      - ./load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - identity-provider
      - static-content
    networks:
      - microservices-net

  static-content:
    image: nginx:alpine
    container_name: static-content
    ports:
      - "8080:8080"
    volumes:
      - ./static-content/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - microservices-net

  # -------------------------------------------------------------
  # Gateway & Security Layer
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SERVICE_1A_URL=http://domain-1-service-a:8001
      - SERVICE_1B_URL=http://domain-1-service-b:8002
      - SERVICE_1C_URL=http://domain-1-service-c:8003
      - SERVICE_2A_URL=http://domain-2-service-a:8004
      - SERVICE_2B_URL=http://domain-2-service-b:8005
    networks:
      - microservices-net

  identity-provider:
    build:
      context: ./identity-provider
    container_name: identity-provider
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    networks:
      - microservices-net

  # -------------------------------------------------------------
  # Coordination & Discovery Layer
  # -------------------------------------------------------------
  service-coordination:
    image: zookeeper:3.9
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888;2181
    volumes:
      - ./service-coordination/zoo.cfg:/conf/zoo.cfg:ro
    networks:
      - microservices-net

  service-registry:
    image: hashicorp/consul:1.16
    container_name: service-registry
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    networks:
      - microservices-net

  # -------------------------------------------------------------
  # Event Messaging & Persistence Layer
  # -------------------------------------------------------------
  message-broker:
    image: rabbitmq:3-management-alpine
    container_name: message-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservices-net

  database-a:
    image: postgres:16-alpine
    container_name: database-a
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: primary_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - ./databases/database-a/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-net

  database-b:
    image: redis:7-alpine
    container_name: database-b
    ports:
      - "6379:6379"
    networks:
      - microservices-net

  # -------------------------------------------------------------
  # Domain 1 Microservices
  # -------------------------------------------------------------
  domain-1-service-a:
    build:
      context: ./microservices/domain-1/service-a
    container_name: domain-1-service-a
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DATABASE_URL=postgres://postgres:postgrespassword@database-a:5432/primary_db
    networks:
      - microservices-net

  domain-1-service-b:
    build:
      context: ./microservices/domain-1/service-b
    container_name: domain-1-service-b
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    networks:
      - microservices-net

  domain-1-service-c:
    build:
      context: ./microservices/domain-1/service-c
    container_name: domain-1-service-c
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
    networks:
      - microservices-net

  # -------------------------------------------------------------
  # Domain 2 Microservices
  # -------------------------------------------------------------
  domain-2-service-a:
    build:
      context: ./microservices/domain-2/service-a
    container_name: domain-2-service-a
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
    networks:
      - microservices-net

  domain-2-service-b:
    build:
      context: ./microservices/domain-2/service-b
    container_name: domain-2-service-b
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
