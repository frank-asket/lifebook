# Separate resources only. Never point these database/auth variables at production.
services:
  - type: web
    name: lifebook-api-staging
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    branch: staging
    region: frankfurt
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_RATE_LIMIT
        value: "120"
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Staging may show the prayer topic library before pastoral review; production must not.
      - key: PRAYER_COMPANION_ALLOW_DRAFT
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: API_BIBLE_KEY
        sync: false
      - key: API_BIBLE_EN_BIBLE_ID
        value: de4e12af7f28f599-01
      - key: API_BIBLE_FR_BIBLE_ID
        value: a93a92589195411f-01
      - key: BIBLE_NOTES_ENCRYPTION_KEY
        sync: false
      - key: REFLECTION_ENCRYPTION_KEYS
        sync: false
      - key: REFLECTION_ENCRYPTION_ACTIVE_KEY
        sync: false
# AI service intentionally omitted: it stays disabled until M3.7 Prayer Sanctuary.
