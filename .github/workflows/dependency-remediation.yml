name: Dependency Lockfile Remediation
on:
  push:
    branches:
      - security/m05-remediate-transitive-advisories
    paths:
      - package.json
      - .github/workflows/dependency-remediation.yml
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/dependency-remediation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Resolve lockfile against patched transitive constraints
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit regenerated lockfile on isolated remediation branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/security/m05-remediate-transitive-advisories'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'security: regenerate pnpm lockfile for patched dependencies'
            git push origin HEAD:security/m05-remediate-transitive-advisories
          fi
      - name: Upload reviewed lockfile for source-controlled commit
        uses: actions/upload-artifact@v4
        with:
          name: remediated-pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 7
      - name: Inspect remaining high-severity advisories
        run: pnpm audit --audit-level high
