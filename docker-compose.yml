services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lifebook
      POSTGRES_PASSWORD: lifebook_dev_only
      POSTGRES_DB: lifebook
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifebook"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
